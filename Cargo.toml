[package]
name = "vimouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A modal keyboard-driven mouse for Linux"
license = "Apache-2.0"

[dependencies]
evdev = "0.13.2"
fontdue = { version = "0.9", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
smithay-client-toolkit = { version = "0.20", default-features = false }
toml = "1.1"
wayland-client = "0.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
